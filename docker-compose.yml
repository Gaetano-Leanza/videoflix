services:
  db:
    image: postgres:16-alpine
    container_name: videoflix_db
    environment:
      POSTGRES_DB: videoflix
      POSTGRES_USER: videoflix_user
      POSTGRES_PASSWORD: videoflix_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: videoflix_redis
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: videoflix_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=videoflix
      - POSTGRES_USER=videoflix_user
      - POSTGRES_PASSWORD=videoflix_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: videoflix_worker
    command: python manage.py rqworker default
    volumes:
      - .:/app
      - media_data:/app/media
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=videoflix
      - POSTGRES_USER=videoflix_user
      - POSTGRES_PASSWORD=videoflix_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  media_data: